name: macOS 构建

on:
  workflow_dispatch:
    inputs:
      build_server:
        description: "构建服务器 HTTPS 地址"
        required: true
        type: string
      build_token:
        description: "构建服务器 TOKEN"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.47.1"

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache-dependency-path: |
            core/go.sum

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 设置 Rust 环境
        run: |
          if command -v rustc >/dev/null 2>&1; then
            rustc --version
            cargo --version
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
        shell: bash

      - name: 设置 Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          sw_vers
          uname -m
          xcodebuild -version
        shell: bash

      - name: 执行 macOS 打包脚本
        timeout-minutes: 90
        run: |
          BUILD_SERVER="$(
            python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]["build_server"], end="")'
          )"
          BUILD_TOKEN="$(
            python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]["build_token"], end="")'
          )"
          echo "::add-mask::$BUILD_SERVER"
          echo "::add-mask::$BUILD_TOKEN"
          export BUILD_SERVER BUILD_TOKEN
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install Pillow==12.3.0
          python3 auto_pack_macos_client.py
        shell: bash
