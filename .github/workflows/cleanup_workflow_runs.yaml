name: 清理 Actions 运行记录

on:
  workflow_dispatch:
    inputs:
      keep_last:
        description: '每个工作流保留最近多少次运行（0 = 全部删除，含其他工作流）'
        required: true
        default: '5'
        type: string
      dry_run:
        description: '仅预览，不真正删除'
        required: true
        default: true
        type: boolean
      workflow_name:
        description: '只清理指定工作流名称（留空 = 全部工作流）。例：一键构建'
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 批量删除 workflow runs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const keepLast = Math.max(0, parseInt('${{ inputs.keep_last }}', 10) || 0);
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            const filterName = '${{ inputs.workflow_name }}'.trim();
            const currentRunId = context.runId;

            core.info(`仓库: ${owner}/${repo}`);
            core.info(`保留最近: ${keepLast} 次 / 每个工作流`);
            core.info(`预览模式: ${dryRun}`);
            if (filterName) {
              core.info(`仅清理工作流: ${filterName}`);
            }

            // 拉取全部 workflows
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 },
            );

            let totalDeleted = 0;
            let totalSkipped = 0;

            for (const wf of workflows) {
              if (filterName && wf.name !== filterName) {
                continue;
              }

              core.info(`\n=== ${wf.name} (${wf.path}) ===`);

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: wf.id,
                  per_page: 100,
                },
              );

              // 按创建时间倒序（API 已大致如此，再稳妥排一次）
              runs.sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime(),
              );

              const toDelete = runs.slice(keepLast);
              core.info(`共 ${runs.length} 次，将处理 ${toDelete.length} 次`);

              for (const run of toDelete) {
                if (run.id === currentRunId) {
                  core.info(`跳过当前清理任务自身 #${run.run_number}`);
                  totalSkipped += 1;
                  continue;
                }

                const label = `#${run.run_number} ${run.display_title || run.name} (${run.status}/${run.conclusion})`;
                if (dryRun) {
                  core.info(`[dry-run] 将删除 ${label}`);
                  totalDeleted += 1;
                  continue;
                }

                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  core.info(`已删除 ${label}`);
                  totalDeleted += 1;
                  // 轻微限速，降低 API 限流概率
                  await new Promise((r) => setTimeout(r, 120));
                } catch (err) {
                  core.warning(`删除失败 ${label}: ${err.message}`);
                  totalSkipped += 1;
                }
              }
            }

            core.info(`\n完成：删除/预览 ${totalDeleted}，跳过 ${totalSkipped}`);
            if (dryRun) {
              core.notice('当前为预览模式。确认无误后，将 dry_run 设为 false 再执行一次。');
            }
